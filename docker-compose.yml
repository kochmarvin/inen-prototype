# Startet ml-service, backend und frontend mit einem einzigen Befehl:
#
#     docker compose up --build
#
# Anschließend:
#   - Frontend:    http://localhost:5173
#   - Backend API: http://localhost:3000
#   - ML Service:  http://localhost:8001 (nur intern verwendet)
#
# Die Desktop-App läuft NICHT im Container, da sie den echten Host-Bildschirm
# aufnimmt. Sie startet wie gehabt mit `python desktop/main.py` auf dem Host
# und postet an http://localhost:3000.

services:
  ml-service:
    build:
      context: ./ml-service
    container_name: emotion-ml-service
    restart: unless-stopped
    environment:
      MODEL_PATH: /app/best.pt
      MIN_CONFIDENCE: "0.25"
    expose:
      - "8001"
    ports:
      # Für Debugging vom Host erreichbar. Wer das nicht braucht, kann das
      # ports:-Block entfernen – ml-service ist über das interne Netz
      # ohnehin per "http://ml-service:8001" für das Backend erreichbar.
      - "8001:8001"
    networks:
      - emotion-net

  backend:
    build:
      context: ./backend
    container_name: emotion-backend
    restart: unless-stopped
    environment:
      PORT: "3000"
      ML_SERVICE_URL: "http://ml-service:8001"
      ML_TIMEOUT_MS: "15000"
    ports:
      - "3000:3000"
    depends_on:
      ml-service:
        condition: service_healthy
    networks:
      - emotion-net

  frontend:
    build:
      context: ./frontend
      args:
        # Wert wird in den Vite-Bundle gebaut. Der Browser läuft auf dem
        # Host, daher zeigt die URL auf localhost:3000 (Host-Port des
        # backend-Containers).
        VITE_BACKEND_URL: "http://localhost:3000"
    container_name: emotion-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - emotion-net

networks:
  emotion-net:
    driver: bridge
